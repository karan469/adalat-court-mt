[project]
name = "court-mt"
version = "0.1.0"
description = "Token-efficient English->Hindi translation for Indian High Court judgments"
requires-python = ">=3.10"

dependencies = [
    "transformers==4.44.2",
    "tokenizers==0.19.1",
    "sentencepiece==0.2.0",
    "tiktoken==0.7.0",
    "protobuf==5.28.2",
    "pandas==2.2.3",
    "numpy==1.26.4",
    "pyyaml==6.0.2",
    "matplotlib==3.9.2",
    "tabulate==0.9.0",
    "regex==2024.9.11",
    "tqdm==4.66.5",
]

[project.optional-dependencies]
# Task 2/3 (alignment + LoRA adaptation) — not needed for the tokenizer study.
train = [
    "torch==2.4.1",
    "peft==0.13.0",
    "datasets==3.0.1",
    "accelerate==0.34.2",
    "sacrebleu==2.4.3",
    "evaluate==0.4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/court_mt"]

[tool.ruff]
line-length = 100
target-version = "py310"
